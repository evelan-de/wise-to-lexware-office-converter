name: ImmuniWeb Security Scan

on:
  # Run on deployment completion (works with Vercel preview deployments)
  deployment_status:
  # Allow manual trigger with custom URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (leave empty for production URL)'
        required: false
        default: ''

jobs:
  security-scan:
    name: Website Security Test
    runs-on: ubuntu-latest
    # Use Preview environment to access environment secrets
    environment: Preview
    # Only run when deployment is successful or on manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine target URL
        id: url
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.target_url }}" ]; then
              TARGET_URL="${{ github.event.inputs.target_url }}"
            else
              TARGET_URL="https://wise-lexware-convert.evelan.de"
            fi
          else
            # Use Vercel preview URL from deployment
            TARGET_URL="${{ github.event.deployment_status.target_url }}"
          fi

          # Append Vercel protection bypass parameters for preview deployments
          # This allows scanning protected Vercel preview deployments
          # See: https://vercel.com/docs/deployment-protection/methods-to-bypass-deployment-protection/protection-bypass-automation
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "✓ VERCEL_AUTOMATION_BYPASS_SECRET is configured (length: ${#VERCEL_AUTOMATION_BYPASS_SECRET} chars)"
            # Check if URL already has query parameters
            if [[ "$TARGET_URL" == *"?"* ]]; then
              TARGET_URL="${TARGET_URL}&x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=samesitenone"
            else
              TARGET_URL="${TARGET_URL}?x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=samesitenone"
            fi
            echo "Vercel protection bypass parameters added to URL"
          else
            echo "⚠ VERCEL_AUTOMATION_BYPASS_SECRET is NOT configured - preview deployments may return 401"
          fi

          echo "target_url=${TARGET_URL}" >> $GITHUB_OUTPUT
          echo "Scanning URL: ${TARGET_URL%\?*}"  # Log URL without secret

      - name: Run ImmuniWeb Website Security Test
        id: security-scan
        run: |
          TARGET_URL="${{ steps.url.outputs.target_url }}"
          # Log URL without query parameters (to avoid exposing bypass secret)
          echo "Starting ImmuniWeb security scan for: ${TARGET_URL%\?*}"

          # Pull Docker image first (separates pull logs from scan output)
          echo "Pulling ImmuniWeb Docker image..."
          docker pull immuniweb/iwtools:latest

          # Create output directory with proper permissions
          mkdir -p scan-output
          chmod 777 scan-output

          # Verify config file exists
          echo "Checking config file..."
          ls -la ${{ github.workspace }}/.github/immuniweb/

          # Run the security scan using Docker
          # -o specifies output file, -f specifies format (pretty_json for readability)
          # Note: Running without -p first to debug, will add pipeline mode back later
          echo "Running security scan..."
          set +e
          docker run --rm \
            -v ${{ github.workspace }}/scan-output:/output \
            immuniweb/iwtools \
            websec "${TARGET_URL}" \
            -o /output/scan-results.json \
            -f pretty_json 2>&1 | tee scan-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "Docker exit code: $EXIT_CODE"

          # Display scan output for debugging
          echo "=== Scan Output ==="
          cat scan-output.log
          echo "==================="

          # Check what files were created
          echo "=== Output directory contents ==="
          ls -la scan-output/ || echo "scan-output directory is empty"

          # Move results to workspace root
          if [ -f scan-output/scan-results.json ]; then
            mv scan-output/scan-results.json .
            echo "Results file found and moved"
            echo "=== Results preview ==="
            head -100 scan-results.json || true
          else
            echo "No results file generated in scan-output/"
          fi

          # Capture exit code (0=pass, 1=error, 2=input error, 3=checks failed)
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

      - name: Parse scan results
        if: always()
        run: |
          # Extract base URL without query parameters (to avoid exposing bypass secret)
          TARGET_URL="${{ steps.url.outputs.target_url }}"
          DISPLAY_URL="${TARGET_URL%\?*}"

          echo "## ImmuniWeb Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target URL:** ${DISPLAY_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f scan-results.json ]; then
            # Extract key metrics if JSON is valid
            if jq -e . scan-results.json > /dev/null 2>&1; then
              GRADE=$(jq -r '.grade // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              PCI_DSS=$(jq -r '.pci_dss.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              GDPR=$(jq -r '.gdpr.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")

              echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
              echo "| Security Grade | ${GRADE} |" >> $GITHUB_STEP_SUMMARY
              echo "| PCI DSS Compliant | ${PCI_DSS} |" >> $GITHUB_STEP_SUMMARY
              echo "| GDPR Compliant | ${GDPR} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "Scan completed. Check the logs for detailed results." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No results file generated. Check the scan logs." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** ${{ steps.security-scan.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by [ImmuniWeb Community Edition](https://www.immuniweb.com/websec/)*" >> $GITHUB_STEP_SUMMARY

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immuniweb-scan-results
          path: |
            scan-results.json
            scan-output.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Check scan status
        if: always()
        run: |
          EXIT_CODE="${{ steps.security-scan.outputs.exit_code }}"

          case $EXIT_CODE in
            0)
              echo "All security checks passed successfully!"
              ;;
            1)
              echo "::warning::An error occurred during the security scan execution"
              ;;
            2)
              echo "::warning::Input data validation failed"
              ;;
            3)
              echo "::warning::One or more security checks failed. Review the scan results."
              ;;
            *)
              echo "::warning::Unknown exit code: $EXIT_CODE"
              ;;
          esac

          # Don't fail the workflow for security warnings - just report them
          # Uncomment the next line to make security failures block PRs:
          # exit $EXIT_CODE
