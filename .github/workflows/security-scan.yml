name: ImmuniWeb Security Scan

on:
  # Run on deployment completion (works with Vercel preview deployments)
  deployment_status:
  # Allow manual trigger with custom URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (leave empty for production URL)'
        required: false
        default: ''

jobs:
  security-scan:
    name: Website Security Test
    runs-on: ubuntu-latest
    # Use Preview environment to access environment secrets
    environment: Preview
    # Only run when deployment is successful or on manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine target URL
        id: url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.target_url }}" ]; then
              BASE_URL="${{ github.event.inputs.target_url }}"
            else
              BASE_URL="https://wise-lexware-convert.evelan.de"
            fi
          else
            # Use Vercel preview URL from deployment
            BASE_URL="${{ github.event.deployment_status.target_url }}"
          fi

          # Output the base URL (without bypass parameters - those will be added in scan step)
          echo "base_url=${BASE_URL}" >> $GITHUB_OUTPUT
          echo "Scanning URL: ${BASE_URL}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install iwtools
        run: |
          git clone https://github.com/immuniweb/iwtools.git /tmp/iwtools
          cd /tmp/iwtools/iwtools
          pip install -r requirements.txt

      - name: Run ImmuniWeb Website Security Test
        id: security-scan
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          BASE_URL="${{ steps.url.outputs.base_url }}"
          echo "Starting ImmuniWeb security scan for: ${BASE_URL}"

          # Construct full URL with Vercel bypass parameters if secret is configured
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "✓ VERCEL_AUTOMATION_BYPASS_SECRET is configured (length: ${#VERCEL_AUTOMATION_BYPASS_SECRET} chars)"
            TARGET_URL="${BASE_URL}?x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=samesitenone"
            echo "Vercel protection bypass parameters added to URL"
          else
            echo "⚠ VERCEL_AUTOMATION_BYPASS_SECRET is NOT configured - preview deployments may return 401"
            TARGET_URL="${BASE_URL}"
          fi

          # Debug: Show URL structure (masked)
          echo "URL structure: ${BASE_URL}?x-vercel-protection-bypass=***&x-vercel-set-bypass-cookie=samesitenone"

          # Run the security scan using Python directly
          echo "Running security scan..."
          set +e
          cd /tmp/iwtools/iwtools
          python iwtools.py websec "${TARGET_URL}" \
            -o ${{ github.workspace }}/scan-results.json \
            -f pretty_json 2>&1 | tee ${{ github.workspace }}/scan-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "Scan exit code: $EXIT_CODE"

          # Display scan output
          echo "=== Scan Output ==="
          cat ${{ github.workspace }}/scan-output.log
          echo "==================="

          # Check results
          if [ -f ${{ github.workspace }}/scan-results.json ]; then
            echo "Results file found"
            echo "=== Results preview ==="
            head -100 ${{ github.workspace }}/scan-results.json || true
          else
            echo "No results file generated"
          fi

          # Capture exit code (0=pass, 1=error, 2=input error, 3=checks failed)
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

      - name: Parse scan results
        if: always()
        run: |
          DISPLAY_URL="${{ steps.url.outputs.base_url }}"

          echo "## ImmuniWeb Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target URL:** ${DISPLAY_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f scan-results.json ]; then
            # Extract key metrics if JSON is valid
            if jq -e . scan-results.json > /dev/null 2>&1; then
              GRADE=$(jq -r '.grade // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              PCI_DSS=$(jq -r '.pci_dss.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              GDPR=$(jq -r '.gdpr.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")

              echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
              echo "| Security Grade | ${GRADE} |" >> $GITHUB_STEP_SUMMARY
              echo "| PCI DSS Compliant | ${PCI_DSS} |" >> $GITHUB_STEP_SUMMARY
              echo "| GDPR Compliant | ${GDPR} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "Scan completed. Check the logs for detailed results." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No results file generated. Check the scan logs." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** ${{ steps.security-scan.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by [ImmuniWeb Community Edition](https://www.immuniweb.com/websec/)*" >> $GITHUB_STEP_SUMMARY

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immuniweb-scan-results
          path: |
            scan-results.json
            scan-output.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Check scan status
        if: always()
        run: |
          EXIT_CODE="${{ steps.security-scan.outputs.exit_code }}"

          case $EXIT_CODE in
            0)
              echo "All security checks passed successfully!"
              ;;
            1)
              echo "::warning::An error occurred during the security scan execution"
              ;;
            2)
              echo "::warning::Input data validation failed"
              ;;
            3)
              echo "::warning::One or more security checks failed. Review the scan results."
              ;;
            *)
              echo "::warning::Unknown exit code: $EXIT_CODE"
              ;;
          esac

          # Don't fail the workflow for security warnings - just report them
          # Uncomment the next line to make security failures block PRs:
          # exit $EXIT_CODE
