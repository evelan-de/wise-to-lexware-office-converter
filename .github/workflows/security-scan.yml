name: ImmuniWeb Security Scan

on:
  # Run on deployment completion (works with Vercel preview deployments)
  deployment_status:
  # Allow manual trigger with custom URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (leave empty for production URL)'
        required: false
        default: ''

jobs:
  security-scan:
    name: Website Security Test
    runs-on: ubuntu-latest
    # Only run when deployment is successful or on manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine target URL
        id: url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.target_url }}" ]; then
              TARGET_URL="${{ github.event.inputs.target_url }}"
            else
              TARGET_URL="https://wise-lexware-convert.evelan.de"
            fi
          else
            # Use Vercel preview URL from deployment
            TARGET_URL="${{ github.event.deployment_status.target_url }}"
          fi
          echo "target_url=${TARGET_URL}" >> $GITHUB_OUTPUT
          echo "Scanning URL: ${TARGET_URL}"

      - name: Run ImmuniWeb Website Security Test
        id: security-scan
        run: |
          echo "Starting ImmuniWeb security scan for: ${{ steps.url.outputs.target_url }}"

          # Run the security scan using Docker
          # Using -p (pipeline) mode to validate against config thresholds
          docker run --rm \
            -v ${{ github.workspace }}/.github/immuniweb:/config:ro \
            immuniweb/iwtools \
            websec "${{ steps.url.outputs.target_url }}" \
            -p \
            -cfg /config/websec.yaml \
            --json-file /dev/stdout 2>&1 | tee scan-results.json || EXIT_CODE=$?

          # Capture exit code (0=pass, 1=error, 2=input error, 3=checks failed)
          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

      - name: Parse scan results
        if: always()
        run: |
          echo "## ImmuniWeb Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target URL:** ${{ steps.url.outputs.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f scan-results.json ]; then
            # Extract key metrics if JSON is valid
            if jq -e . scan-results.json > /dev/null 2>&1; then
              GRADE=$(jq -r '.grade // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              PCI_DSS=$(jq -r '.pci_dss.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")
              GDPR=$(jq -r '.gdpr.compliant // "N/A"' scan-results.json 2>/dev/null || echo "N/A")

              echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
              echo "| Security Grade | ${GRADE} |" >> $GITHUB_STEP_SUMMARY
              echo "| PCI DSS Compliant | ${PCI_DSS} |" >> $GITHUB_STEP_SUMMARY
              echo "| GDPR Compliant | ${GDPR} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "Scan completed. Check the logs for detailed results." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No results file generated. Check the scan logs." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** ${{ steps.security-scan.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by [ImmuniWeb Community Edition](https://www.immuniweb.com/websec/)*" >> $GITHUB_STEP_SUMMARY

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immuniweb-scan-results
          path: scan-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Check scan status
        if: always()
        run: |
          EXIT_CODE="${{ steps.security-scan.outputs.exit_code }}"

          case $EXIT_CODE in
            0)
              echo "All security checks passed successfully!"
              ;;
            1)
              echo "::warning::An error occurred during the security scan execution"
              ;;
            2)
              echo "::warning::Input data validation failed"
              ;;
            3)
              echo "::warning::One or more security checks failed. Review the scan results."
              ;;
            *)
              echo "::warning::Unknown exit code: $EXIT_CODE"
              ;;
          esac

          # Don't fail the workflow for security warnings - just report them
          # Uncomment the next line to make security failures block PRs:
          # exit $EXIT_CODE
