<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners - Evelan CI -->
  <rect width="512" height="512" rx="96" fill="#003366"/>

  <!-- Arrow/conversion icon representing Wise to Lexware conversion -->
  <g transform="translate(80, 120)">
    <!-- Left document (Wise) -->
    <rect x="0" y="40" width="140" height="200" rx="12" fill="white" opacity="0.95"/>
    <rect x="20" y="70" width="100" height="8" rx="4" fill="#00ADEF"/>
    <rect x="20" y="95" width="80" height="8" rx="4" fill="#003366" opacity="0.3"/>
    <rect x="20" y="120" width="90" height="8" rx="4" fill="#003366" opacity="0.3"/>
    <rect x="20" y="145" width="70" height="8" rx="4" fill="#003366" opacity="0.3"/>
    <rect x="20" y="175" width="100" height="8" rx="4" fill="#00ADEF"/>
    <rect x="20" y="200" width="60" height="8" rx="4" fill="#003366" opacity="0.3"/>

    <!-- Arrow in the middle -->
    <g transform="translate(156, 100)">
      <circle cx="20" cy="40" r="35" fill="#00ADEF"/>
      <path d="M8 40 L28 40 M20 28 L32 40 L20 52" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right document (Lexware) -->
    <rect x="212" y="40" width="140" height="200" rx="12" fill="white" opacity="0.95"/>
    <rect x="232" y="70" width="100" height="8" rx="4" fill="#003366"/>
    <rect x="232" y="95" width="80" height="8" rx="4" fill="#00ADEF" opacity="0.5"/>
    <rect x="232" y="120" width="90" height="8" rx="4" fill="#00ADEF" opacity="0.5"/>
    <rect x="232" y="145" width="70" height="8" rx="4" fill="#00ADEF" opacity="0.5"/>
    <rect x="232" y="175" width="100" height="8" rx="4" fill="#003366"/>
    <rect x="232" y="200" width="60" height="8" rx="4" fill="#00ADEF" opacity="0.5"/>
  </g>
</svg>
